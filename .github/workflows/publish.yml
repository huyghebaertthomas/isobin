name: publish

# Publishes to npm when a version tag is pushed, and stamps the package with
# provenance: a signed, public record of which repository, which commit and
# which workflow run produced the tarball. That record is what npmjs.com renders
# as the green "Built and signed on GitHub Actions" panel, linking back here.
#
# The tag is the trigger, so releasing is one local command and nothing to click
# afterwards. The GitHub Release is made here, from the tag, rather than being
# the thing that starts the run — one less step to remember, and no way to end
# up with a release whose tag was never published.
#
# No NPM_TOKEN. npm's trusted publishing takes a short-lived OIDC token minted
# by GitHub for this one workflow run, which is why `id-token: write` below is
# not optional — without it npm has nothing to verify and the publish fails.
# See .github/PUBLISHING.md for the one-time setup on npmjs.com.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub Release
  id-token: write # to prove to npm who is publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are written from the history

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs a newer npm than any Node ships with.
      - name: Use an npm that can do trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      # A tag v0.2.0 against a package.json still saying 0.1.0 would otherwise
      # fail deep inside `npm publish`, or quietly republish the old version.
      # Say so here instead, where the message is readable.
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            echo "Delete the tag, bump the version, and tag again."
            exit 1
          fi
          echo "Publishing $version"

      - run: npm publish --access public

      # Last, so a release only ever exists for a version that really shipped.
      # A pre-release version (1.0.0-beta.1) is marked as one, which keeps it off
      # the repository's headline release.
      - name: Write the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
